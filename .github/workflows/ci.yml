name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Also validates that the committed Gradle wrapper jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v6

      # Compiles and runs the tests. Testcontainers uses the runner's Docker.
      - name: Build and test
        run: ./gradlew build

      - name: Build container image
        run: docker build --tag certkit:ci .
