spring.application.name=certkit

# The database connection comes from the environment (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD): compose.yaml sets it
# when running the app, and Testcontainers sets it in tests.

# Keep the JPA session scoped to the service layer, not the whole web request.
spring.jpa.open-in-view=false

# Only the health endpoint is exposed over HTTP, and without component details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
